[package]
name = "droid-agent"
version = "0.1.0"
edition = "2021"
authors = ["ADB-GUI Team"]
description = "Ultra-lightweight in-device native agent for Android app label extraction and inventory."

[dependencies]
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
