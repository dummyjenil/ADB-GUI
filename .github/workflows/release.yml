name: "Release DroidCrack"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Apple Silicon (M1/M2/M3)
            args: "--target aarch64-apple-darwin"
          - platform: "macos-13" # Intel x86_64 Mac
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04" # Linux (.deb, .AppImage)
            args: ""
          - platform: "windows-latest" # Windows (.exe, .msi)
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "latest"
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || matrix.platform == 'macos-13' && 'x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            javascriptcoregtk-4.1

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build & Publish Release with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DroidCrack ${{ github.ref_name }}"
          releaseBody: |
            ## DroidCrack Release ${{ github.ref_name }}

            ### Downloads for all operating systems:
            - **Windows**: `.exe` (NSIS Installer) / `.msi`
            - **macOS**: `.dmg` (Apple Silicon & Intel)
            - **Linux**: `.AppImage` / `.deb`

            *Built automatically via GitHub Actions with high-performance native optimizations.*
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
